name: taskflow

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-taskflow}
      POSTGRES_USER: ${DB_USER:-taskflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - backend
    restart: unless-stopped

  api:
    image: ${DOCKERHUB_USER}/taskflow-api:${TASKFLOW_VERSION:-1.0.0}
    environment:
      APP_ENV: ${APP_ENV:-production}
      DB_HOST: db
      DB_NAME: ${DB_NAME:-taskflow}
      DB_USER: ${DB_USER:-taskflow}
      DB_PASSWORD: ${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - frontend
      - backend
    restart: unless-stopped

  front:
    image: ${DOCKERHUB_USER}/taskflow-front:${TASKFLOW_VERSION:-1.0.0}
    ports:
      - "${FRONT_PORT:-8080}:80"
    depends_on:
      - api
    networks:
      - frontend
    restart: unless-stopped

networks:
  frontend:
  backend:
    internal: true

volumes:
  pgdata:
